name: log-response run

# The GitHub-hosted path for producing a run (the other is the sandbox --
# see wiki/Running.md). Weights download fine here, so `--model vgg19` works
# directly with no conversion; the limits are compute, disk and the 6 h job cap.
#
# Output is the committable `results/<slug>/` layout, uploaded as an artifact:
# download it, drop it into results/ and commit. Provenance in run.json records
# the runner, so a GitHub run and a sandbox run are told apart after the fact.

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model spec (vgg19, resnet152, vit_b_16, clip:ViT-B-32, ...)"
        default: vgg19
      reps:
        description: "Random orient/phase draws per (contrast, frequency) cell"
        default: "250"
      seed:
        description: "RNG / scramble seed (part of the run slug)"
        default: "0"
      scramble_seed:
        description: "Seed for the within-layer weight permutation (blank = same
          as 'seed'). Set it to sweep permutations while holding the
          orientation/phase draws fixed: sweeping 'seed' alone moves both at
          once, so it bounds their combined variance instead of isolating
          either. Appears in the slug as -p<n> so a sweep cannot collide."
        default: ""
      frequencies:
        description: "Comma-separated cycles/image (blank = the full 8-frequency grid)"
        default: ""
      contrasts:
        description: "Contrast grid: blank = the 14 log-spaced defaults, or
          'linear[:N]' for evenly spaced over the same range. The default grid is
          not neutral between the two laws logness compares, so a verdict is only
          trustworthy if it survives both."
        default: ""
      layers:
        description: "Comma-separated module names to tap (blank = per-arch default)"
        default: ""
      size:
        description: "Grating size in pixels (blank = the back-end's native input
          size). Frequencies are in cycles per *image*, so this does not change
          the stimulus -- it changes how finely it is sampled, and on the VLM
          back-end how much work a forward pass is: llava-interleave reports a
          native 384 and tiles it anyres, measured at 62 s per forward pass on a
          4-core runner, which puts the standard grid 7.4x over the job cap."
        default: ""
      notes:
        description: "One-line description, stored in run.json and notes.md"
        default: ""
      slug_suffix:
        description: "Appended to the computed results/ slug, e.g. 'in1k'. Needed
          when the default would collide with a run made from different weights —
          the slug encodes model/variant/reps/seed but not weight lineage."
        default: ""
      variants:
        description: "Which runs to launch (they go in parallel)"
        type: choice
        options: [both, pretrained, scrambled]
        default: both
      weights:
        description: "Which checkpoint. 'canonical' = torchvision IMAGENET1K_V1;
          'caffe' = the original Oxford VGG-19 converted on the runner. The two
          disagree, so the comparison needs both — vgg19 only."
        type: choice
        options: [canonical, caffe]
        default: canonical

jobs:
  measure:
    runs-on: ubuntu-latest
    # The runner kills the job at 6 h; stop first so the upload step still runs.
    timeout-minutes: 330

    # For the commit-back step below. Artifacts are the fallback, not the
    # primary channel: the sandbox cannot reach the artifact blob host, so a run
    # that only uploaded would be unreachable from the place that analyses it.
    permissions:
      contents: write

    strategy:
      fail-fast: false
      # The pretrained run and its weight-scrambled control are the result as a
      # pair (R^2 ~0.98 vs the control), so run both unless asked otherwise.
      # On a push event `inputs` is empty and this falls through to both.
      matrix:
        scramble: ${{ fromJSON(inputs.variants == 'pretrained' && '[false]' || inputs.variants == 'scrambled' && '[true]' || '[false, true]') }}

    # Inputs reach the shell as environment variables, never interpolated into
    # the script text. The `||` defaults cover the push trigger, where the
    # `inputs` context is empty.
    env:
      MODEL: ${{ inputs.model || 'vgg19' }}
      REPS: ${{ inputs.reps || '250' }}
      SEED: ${{ inputs.seed || '0' }}
      SCRAMBLE_SEED: ${{ inputs.scramble_seed }}
      FREQUENCIES: ${{ inputs.frequencies }}
      CONTRASTS: ${{ inputs.contrasts }}
      LAYERS: ${{ inputs.layers }}
      SIZE: ${{ inputs.size }}
      NOTES: ${{ inputs.notes }}
      SLUG_SUFFIX: ${{ inputs.slug_suffix }}
      SCRAMBLE: ${{ matrix.scramble }}
      WEIGHTS: ${{ inputs.weights || 'canonical' }}
      # Kept out of the workspace so `git add results/<slug>` can never sweep a
      # 575 MB checkpoint into a commit.
      CAFFE_H5: ${{ github.workspace }}/../caffe-cache/vgg19_keras.h5
      CAFFE_PTH: ${{ github.workspace }}/../caffe-cache/vgg19_caffe.pth

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # wiki/Running.md quotes runner specs that decide whether a grid fits in
      # 6 h, so have each run state them rather than trusting the doc.
      - name: Runner facts
        run: |
          echo "cores:  $(nproc)"
          echo "memory: $(free -g | awk '/^Mem:/ {print $2}') GB"
          echo "disk:   $(df -BG --output=avail / | tail -1 | tr -d ' ') free"

      # The VGG-19 checkpoint is ~550 MB; without this every run re-downloads it.
      - name: Cache torch hub weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch
          key: torch-hub-${{ env.MODEL }}

      - name: Install CPU-only deps
        # The CPU wheel index matters: plain `pip install torch` pulls ~3.4 GB of
        # CUDA/triton packages onto a 14 GB disk for no benefit on a CPU runner.
        run: |
          python -m pip install --upgrade pip
          pip install numpy matplotlib
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          case "$MODEL" in
            clip:*)         pip install open_clip_torch ;;
            hf:*|sam|sam:*) pip install transformers pillow ;;
          esac

      - name: Verify the pipeline offline
        run: python -m log_response.test_pipeline

      # 575 MB against a ~14 GB disk, and both matrix jobs want the same file,
      # so cache the HDF5 rather than fetching it twice per dispatch.
      - name: Cache the Caffe HDF5
        if: ${{ inputs.weights == 'caffe' }}
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../caffe-cache
          key: caffe-vgg19-h5-v1

      - name: Fetch and convert the Caffe checkpoint
        if: ${{ inputs.weights == 'caffe' }}
        # --verify fails above 1e-5. It is cheap and it guards the one step that
        # could fake a result: a gain error in the preprocessing fold rescales
        # effective contrast, sliding the contrast-response curve along its own
        # axis. Measured at 2.9e-8, but the run should re-establish that rather
        # than inherit the claim.
        run: |
          pip install h5py
          mkdir -p "$(dirname "$CAFFE_H5")"
          python -m log_response.convert_weights \
            --cache "$CAFFE_H5" --out "$CAFFE_PTH" --verify
          df -BG --output=avail / | tail -1 | tr -d ' ' | xargs echo "disk left:"

      # Resolved before the measurement so a name clash costs seconds, not the
      # 12-120 min the grid takes.
      - name: Resolve the run slug
        run: |
          # results/ slug convention: <model>[-<variant>]-r<reps>-s<seed>,
          # with the model spec reduced to slug-safe characters.
          slug=$(printf '%s' "$MODEL" | tr -c 'a-zA-Z0-9' '-' | sed 's/-\{1,\}/-/g; s/^-//; s/-$//')
          if [ "$SCRAMBLE" = "true" ]; then slug="$slug-scramble"; fi
          slug="$slug-r$REPS-s$SEED"
          # A permutation sweep holds --seed fixed and varies --scramble-seed, so
          # without this every member of the sweep resolves to the same slug and
          # all but the first would abort on the collision check below.
          if [ "$SCRAMBLE" = "true" ] && [ -n "$SCRAMBLE_SEED" ] \
             && [ "$SCRAMBLE_SEED" != "$SEED" ]; then
            slug="$slug-p$SCRAMBLE_SEED"
          fi
          # A suffix rather than a full override: the variant marker must stay
          # automatic, or the two matrix jobs would write to the same directory.
          suffix="$SLUG_SUFFIX"
          # Weight lineage is a real axis of disagreement, not a footnote, so a
          # caffe run labels itself rather than relying on the operator to.
          if [ -z "$suffix" ] && [ "$WEIGHTS" = "caffe" ]; then suffix="caffe"; fi
          if [ -n "$suffix" ]; then slug="$slug-$suffix"; fi

          # The slug encodes model, variant, reps and seed -- but NOT weight
          # lineage, so `vgg19 --reps 50 --seed 0` collides whether the weights
          # are IMAGENET1K_V1 or a converted local checkpoint. Overwriting would
          # replace a committed run's data while save_run_dir preserves its
          # notes.md, leaving prose that describes different numbers. Refuse.
          if [ -e "results/$slug" ]; then
            echo "::error::results/$slug already exists. The slug does not encode"
            echo "::error::weight lineage, so this would overwrite a different run's"
            echo "::error::data while keeping its notes.md. Set the 'slug_suffix'"
            echo "::error::input (e.g. in1k -> ${slug}-in1k) if this is a distinct run."
            exit 1
          fi

          echo "SLUG=$slug" >> "$GITHUB_ENV"
          echo "will write results/$slug"

      - name: Run the measurement
        run: |
          slug="$SLUG"
          notes="$NOTES"
          if [ -z "$notes" ]; then
            notes="$MODEL, reps=$REPS, seed=$SEED"
            if [ "$SCRAMBLE" = "true" ]; then notes="$notes, weights scrambled"; fi
            notes="$notes; $WEIGHTS weights; GitHub-hosted runner"
          fi

          args=(--model "$MODEL" --reps "$REPS" --seed "$SEED"
                --save-run "results/$slug" --notes "$notes" --figures out/)
          # run.json records the weights digest, so which checkpoint produced a
          # run is recoverable from the committed directory alone.
          if [ "$WEIGHTS" = "caffe" ]; then args+=(--weights "$CAFFE_PTH"); fi
          if [ -n "$FREQUENCIES" ]; then args+=(--frequencies "$FREQUENCIES"); fi
          if [ -n "$CONTRASTS" ]; then args+=(--contrasts "$CONTRASTS"); fi
          if [ -n "$LAYERS" ]; then args+=(--layers "$LAYERS"); fi
          if [ -n "$SIZE" ]; then args+=(--size "$SIZE"); fi
          if [ "$SCRAMBLE" = "true" ]; then args+=(--scramble); fi
          if [ -n "$SCRAMBLE_SEED" ]; then args+=(--scramble-seed "$SCRAMBLE_SEED"); fi

          python -m log_response.run "${args[@]}" 2>&1 | tee run.log

      - name: Summarise on the run page
        if: always()
        run: |
          {
            echo "## \`$MODEL\`${SCRAMBLE:+ (scramble=$SCRAMBLE)} — \`results/${SLUG:-?}\`"
            echo '```'
            sed -n '/^layer /,$p' run.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # results/ is committed by convention (results/README.md), and a surface is
      # a few KB regardless of --reps. Pushing it here is what makes a runner
      # result reachable from the sandbox, which cannot download artifacts —
      # rule 1 in CLAUDE.md: a number without a committed run does not count.
      #
      # Runs on every event, including workflow_dispatch from the default
      # branch, so a dispatched run commits to whatever ref it was launched from
      # rather than silently leaving its data in an expiring artifact. There is
      # no push trigger to re-fire, so this cannot loop.
      - name: Commit the run into results/
        if: success()
        run: |
          if [ ! -d "results/$SLUG" ]; then
            echo "no results/$SLUG to commit"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "results/$SLUG"
          if git diff --cached --quiet; then
            echo "results/$SLUG already committed, unchanged"; exit 0
          fi
          git commit -q -m "Add results/$SLUG (run ${GITHUB_RUN_ID})"
          # The two matrix jobs finish minutes apart and push to the same
          # branch, so rebase onto whatever landed first before retrying.
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "pushed on attempt $attempt"; exit 0
            fi
            sleep $((attempt * 5))
            git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          done
          echo "::error::could not push results/$SLUG after 5 attempts"
          exit 1

      - name: Upload the run directory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Artifact names cannot contain '/' or ':', which model specs can.
          name: run-${{ matrix.scramble && 'scrambled' || 'pretrained' }}-${{ github.run_id }}
          # results/ is the deliverable; figures are deliberately not committed
          # (results/README.md) but are useful to eyeball off the artifact.
          path: |
            results/
            out/
            run.log
          if-no-files-found: warn
          retention-days: 90
