name: log-response run

# Runs the log-contrast-response measurement on a GitHub-hosted runner and
# uploads the saved surfaces + fit summary + figures as a build artifact.
# Standard runners are free and unmetered on public repositories; the hard cap
# is 6 h per job. A full 14x8x250 grid on VGG-19 takes ~1.3 h on the 4-vCPU
# runner, so the default inputs fit comfortably. See log_response/COMPUTE.md.

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model spec (vgg19, resnet152, vit_b_16, clip:ViT-B-32, ...)"
        default: vgg19
      reps:
        description: "Random orient/phase draws per (contrast, frequency) cell"
        default: "250"
      frequencies:
        description: "Comma-separated cycles/image (blank = the full 8-frequency grid)"
        default: ""
      layers:
        description: "Comma-separated module names to tap (blank = per-arch default)"
        default: ""
      variants:
        description: "Which runs to launch (they go in parallel)"
        type: choice
        options: [both, pretrained, scrambled]
        default: both
  # GitHub only registers workflow_dispatch once the file is on the default
  # branch, so until this merges the push trigger is the only way to launch it.
  # Drop this block after merging; dispatch covers everything then.
  push:
    branches: [claude/free-online-compute-r0p8y2]
    paths:
      - ".github/workflows/log-response.yml"
      - "log_response/**"

jobs:
  measure:
    runs-on: ubuntu-latest
    # The runner kills the job at 6 h; stop first so the upload step still runs.
    timeout-minutes: 330

    strategy:
      fail-fast: false
      # The pretrained run and its weight-scrambled control are the result as a
      # pair (R^2 ~0.98 vs ~0.60 at 'prob'), so run both unless asked otherwise.
      # On a push event `inputs` is empty and this falls through to both.
      matrix:
        scramble: ${{ fromJSON(inputs.variants == 'pretrained' && '[false]' || inputs.variants == 'scrambled' && '[true]' || '[false, true]') }}

    # Inputs reach the shell as environment variables, never interpolated into
    # the script text. The `||` defaults cover the push trigger, where the
    # `inputs` context is empty.
    env:
      MODEL: ${{ inputs.model || 'vgg19' }}
      REPS: ${{ inputs.reps || '250' }}
      FREQUENCIES: ${{ inputs.frequencies }}
      LAYERS: ${{ inputs.layers }}
      SCRAMBLE: ${{ matrix.scramble }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU-only deps
        # The CPU wheel is a fraction of the default CUDA build's size. Only the
        # deps the chosen back-end needs get installed.
        run: |
          python -m pip install --upgrade pip
          pip install numpy matplotlib
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          case "$MODEL" in
            clip:*)         pip install open_clip_torch ;;
            hf:*|sam|sam:*) pip install transformers pillow ;;
          esac

      - name: Verify the pipeline offline
        run: python -m log_response.test_pipeline

      - name: Run the measurement
        run: |
          args=(--model "$MODEL" --reps "$REPS" --save runs/run --figures out/)
          if [ -n "$FREQUENCIES" ]; then args+=(--frequencies "$FREQUENCIES"); fi
          if [ -n "$LAYERS" ]; then args+=(--layers "$LAYERS"); fi
          if [ "$SCRAMBLE" = "true" ]; then args+=(--scramble); fi
          python -m log_response.run "${args[@]}" 2>&1 | tee run.log

      - name: Summarise on the run page
        if: always()
        run: |
          {
            echo "## \`$MODEL\`${SCRAMBLE:+ (scramble=$SCRAMBLE)}"
            echo '```'
            sed -n '/^layer /,$p' run.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload surfaces, fits and figures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Artifact names cannot contain '/' or ':', which model specs do.
          name: log-response-${{ matrix.scramble && 'scrambled' || 'pretrained' }}-${{ github.run_id }}
          path: |
            runs/
            out/
            run.log
          if-no-files-found: warn
          retention-days: 90
