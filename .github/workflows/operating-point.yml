name: operating point

# Weight-space forensics for the checkpoint question: *what about the training*
# leaves converted Oxford/Caffe VGG-19 flatly linear in contrast through its
# whole conv stack while torchvision's IMAGENET1K_V1 is not (wiki/Results.md).
#
# Separate from log-response.yml because it is a different kind of measurement
# and a different cost. No D surface is produced and no repetition count is
# needed: the statistics are gauge-invariant ratios read off the weights and off
# a few hundred forward passes, so the job is minutes rather than hours. Both
# checkpoints run in the same job, on the same runner, so the pair cannot pick
# up the 2x runner-to-runner variance that wiki/Results.md records for wall time.

on:
  # `workflow_dispatch` only registers once the file is on the default branch, so
  # until this merges the push trigger is the only way to run it. Scoped to the
  # probe's own two files: a doc-only commit on a working branch must not spend a
  # runner, and re-measuring when the probe changes is what you want anyway.
  push:
    paths:
      - ".github/workflows/operating-point.yml"
      - "log_response/operating_point.py"
  workflow_dispatch:
    inputs:
      model:
        description: "torchvision architecture (plain rectifier stacks only:
          vgg19, vgg16, alexnet). The probe measures ReLU gates, so it refuses a
          branching net rather than guessing which modules are the gates."
        default: vgg19
      reps:
        description: "Grating draws per (contrast, frequency) cell. Flip
          fractions are counted over every unit at every spatial position, so a
          handful of draws already averages over millions of gates."
        default: "4"
      seed:
        description: "RNG seed for the orientation/phase draws"
        default: "0"
      caffe:
        description: "Also probe the converted Oxford/Caffe checkpoint. Off gives
          the IMAGENET1K_V1 half alone; vgg19 only."
        type: boolean
        default: true
      compare_in1k:
        description: "Committed --layers all run whose per-tap lambda is joined
          onto the IMAGENET1K_V1 probe, so the artifact is self-contained.
          Skipped if the directory does not exist."
        default: results/vgg19-r250-s0-alllayers-fixed
      compare_caffe:
        description: "Same, for the Caffe probe."
        default: results/vgg19-r250-s0-alllayers-fixed-caffe

jobs:
  probe:
    runs-on: ubuntu-latest
    # Measured end to end (run 31034992278): 25 min, of which the offline suite is
    # 15m43s and the two probes 4m09s and 4m10s. The suite is the part that grows
    # -- it re-fits every committed run in results/ -- so the cap is sized against
    # that growing, not against the measurement.
    timeout-minutes: 180
    permissions:
      contents: write

    env:
      MODEL: ${{ inputs.model || 'vgg19' }}
      REPS: ${{ inputs.reps || '4' }}
      SEED: ${{ inputs.seed || '0' }}
      # On a push the `inputs` context is empty, and `x || true` would also
      # override a deliberate false on dispatch. This reads correctly for both.
      CAFFE: ${{ github.event_name != 'workflow_dispatch' || inputs.caffe }}
      COMPARE_IN1K: ${{ inputs.compare_in1k || 'results/vgg19-r250-s0-alllayers-fixed' }}
      COMPARE_CAFFE: ${{ inputs.compare_caffe || 'results/vgg19-r250-s0-alllayers-fixed-caffe' }}
      CAFFE_H5: ${{ github.workspace }}/../caffe-cache/vgg19_keras.h5
      CAFFE_PTH: ${{ github.workspace }}/../caffe-cache/vgg19_caffe.pth
      OUT: results/operating-point

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Runner facts
        run: |
          echo "cores:  $(nproc)"
          echo "memory: $(free -g | awk '/^Mem:/ {print $2}') GB"
          echo "disk:   $(df -BG --output=avail / | tail -1 | tr -d ' ') free"

      - name: Cache torch hub weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch
          key: torch-hub-${{ env.MODEL }}

      - name: Install CPU-only deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy matplotlib
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Verify the pipeline offline
        run: python -m log_response.test_pipeline

      - name: Cache the Caffe HDF5
        if: ${{ env.CAFFE == 'true' }}
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../caffe-cache
          key: caffe-vgg19-h5-v1

      - name: Fetch and convert the Caffe checkpoint
        if: ${{ env.CAFFE == 'true' }}
        run: |
          pip install h5py
          mkdir -p "$(dirname "$CAFFE_H5")"
          python -m log_response.convert_weights \
            --cache "$CAFFE_H5" --out "$CAFFE_PTH" --verify

      # --gauge-check re-measures after a random rescaling symmetry. Every number
      # the probe reports is supposed to be invariant under it; a drift here means
      # the statistic is reporting the coordinate system rather than the training,
      # so the run should establish that rather than inherit the claim.
      - name: Probe IMAGENET1K_V1
        run: |
          mkdir -p "$OUT"
          args=(--model "$MODEL" --reps "$REPS" --seed "$SEED" --gauge-check
                --out "$OUT/$MODEL-in1k.json")
          # Joining the committed lambda in makes the artifact readable on its
          # own. Optional, because a probe of an arch with no committed run is
          # still worth having.
          if [ -d "$COMPARE_IN1K" ]; then args+=(--compare "$COMPARE_IN1K"); fi
          python -m log_response.operating_point "${args[@]}" 2>&1 | tee in1k.log

      - name: Probe the converted Caffe checkpoint
        if: ${{ env.CAFFE == 'true' }}
        run: |
          args=(--model "$MODEL" --weights "$CAFFE_PTH" --reps "$REPS" --seed "$SEED"
                --gauge-check --out "$OUT/$MODEL-caffe.json")
          if [ -d "$COMPARE_CAFFE" ]; then args+=(--compare "$COMPARE_CAFFE"); fi
          python -m log_response.operating_point "${args[@]}" 2>&1 | tee caffe.log

      - name: Summarise on the run page
        if: always()
        run: |
          {
            for f in in1k caffe; do
              [ -f "$f.log" ] || continue
              echo "## \`$MODEL\` — $f"
              echo '```'
              cat "$f.log"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # Same reasoning as log-response.yml: the sandbox cannot read artifacts, so
      # a result that only uploaded is unreachable from the place that analyses
      # it. These files are a few tens of KB.
      - name: Commit the probe into results/
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          if git diff --cached --quiet; then
            echo "nothing new in $OUT"; exit 0
          fi
          git commit -q -m "Add $OUT for $MODEL (run ${GITHUB_RUN_ID})"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "pushed on attempt $attempt"; exit 0
            fi
            sleep $((attempt * 5))
            git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          done
          echo "::error::could not push $OUT after 5 attempts"
          exit 1

      - name: Upload the probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operating-point-${{ env.MODEL }}
          path: results/operating-point/
          if-no-files-found: warn
